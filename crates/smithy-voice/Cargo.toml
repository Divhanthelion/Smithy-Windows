[package]
name = "smithy-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# **No floem**, like `smithy-agent`, `smithy-tools` and `smithy-sky`. This crate
# turns a microphone into a string and knows nothing about buttons.
#
# Ported from `app-ottex`, which solved this already: Whisper on a dedicated OS
# thread behind a command channel, so a two-second transcription cannot stall a
# UI frame. The parts that did not come across are the ones ottex needed as a
# standalone tray app — global hotkeys, keystroke injection, the cloud API
# fallback and the notification surface. Smithy has its own answers to all four.
[dependencies]
anyhow = { workspace = true }
# Audio capture and resampling to the 16 kHz mono the recognizer expects.
cpal = "0.15"
rubato = "0.14"
# Speech recognition, in this process: k2-fsa's sherpa-onnx, linked
# statically, running NVIDIA's Nemotron streaming model.
sherpa-onnx = "1.13.8"
# Fetching the model once: a checked download of a .tar.bz2 release archive.
ureq = "2"
sha2 = { workspace = true }
tar = "0.4"
bzip2 = "0.5"
serde_json = { workspace = true }
crossbeam-channel = "0.5"
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
